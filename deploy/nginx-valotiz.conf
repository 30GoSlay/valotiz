# Option B (production, HTTPS/wss) : nginx sert les fichiers + proxy /ws -> serveur WebSocket (8091).
# Copier dans /etc/nginx/sites-available/valotiz puis activer ; certbot ajoutera le bloc 443.
server {
    listen 80;
    server_name valotiz.ton-domaine.com;   # <-- remplace par ton domaine

    root /opt/valotiz/app;
    index index.html;

    location = / { return 302 /fps/; }
    location / { try_files $uri $uri/ =404; }

    # WebSocket temps reel
    location /ws {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
